name: Build Windows EXE

on:
  workflow_dispatch: # 允许你在 GitHub 网页上手动点击触发
  push:
    tags:
      - 'v*' # 当你 push 以 v 开头的 tag 时，自动触发

jobs:
  build-windows:
    runs-on: windows-latest # 微软提供的免费 Windows 服务器

    steps:
    - name: 拉取代码
      uses: actions/checkout@v4

    - name: 安装 Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        # Windows 上装 PyTorch 必须指定 CPU 版本，否则会去下 2GB 的显卡驱动包
        pip install torch==2.2.2 torchvision==0.17.2 torchaudio==2.2.2 --index-url https://download.pytorch.org/whl/cpu
        pip install -r requirements.txt

    - name: 使用 PyInstaller 打包
      run: |
        pip install pyinstaller
        # 注意：Windows 的路径分隔符是 ; 而不是 Mac 的 :
        pyinstaller --noconfirm --windowed --name "MarioMakeChat" --add-data "templates;templates" --add-data "static;static" --add-data "momo-extension.js;." launcher.py

    - name: 将生成的 EXE 上传为临时文件
      uses: actions/upload-artifact@v4
      with:
        name: MarioMakeChat-Windows
        path: dist/MarioMakeChat.exe