<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>登录 - M Mario AI</title>
<link rel="icon" href="/static/box.png" type="image/png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", sans-serif;
    background: #1e1e2e; color: #e0e0e0;
    height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  .box {
    background: #2a2a3e;
    padding: 40px;
    border-radius: 16px;
    width: 360px;
    border: 1px solid #3a3a50;
    display: flex; flex-direction: column; gap: 20px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.4);
  }
  h1 { font-size: 20px; text-align: center; }
  .avatar {
    width: 64px; height: 64px; border-radius: 50%;
    background: #1e1e2e; border: 2px solid #4a6cf7;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: bold; color: #4a6cf7;
    margin: 0 auto;
  }
  input[type="password"] {
    padding: 12px 16px; border-radius: 8px;
    border: 1px solid #3a3a50; background: #1e1e2e;
    color: #e0e0e0; font-size: 14px;
  }
  input[type="password"]:focus {
    outline: none; border-color: #4a6cf7;
  }
  button {
    padding: 12px; border-radius: 8px;
    border: none; background: #4a6cf7; color: #fff;
    font-size: 14px; cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: #5a7cff; }
  .error {
    color: #ff6b6b; font-size: 13px;
    text-align: center;
    padding: 8px; background: rgba(255,107,107,0.1);
    border-radius: 6px;
  }
</style>
</head>
<body>
  <form class="box" method="POST" action="/login">
    <div class="avatar">M</div>
    <h1>M Mario AI</h1>
    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
    <input type="password" name="password" placeholder="请输入访问密码" autofocus autocomplete="current-password">
    <button type="submit">登录</button>
  </form>
</body>
</html>
