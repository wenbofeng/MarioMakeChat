<!DOCTYPE html>
<html>
<head>
    <title>Happy Birthday!</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; color: #fff; font-family: 'PingFang SC', sans-serif; }
        #text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 40px; font-weight: bold; text-shadow: 0 0 20px #fff; opacity: 0; transition: opacity 3s ease; text-align: center;}
    </style>
</head>
<body>
    <div id="text">祝 FMC SMO 生日快乐！🎂<br><span style="font-size:20px;">代码无Bug，模型永不崩！</span></div>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];
        function Particle(x, y, color) {
            this.x = x; this.y = y; this.color = color;
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 5 + 2;
            this.vx = Math.cos(angle) * speed;
            this.vy = Math.sin(angle) * speed;
            this.alpha = 1;
            this.radius = Math.random() * 2 + 1;
        }

        Particle.prototype.update = function() {
            this.x += this.vx; this.y += this.vy;
            this.vy += 0.05; // 重力
            this.alpha -= 0.01; // 消散
        };

        Particle.prototype.draw = function() {
            ctx.globalAlpha = Math.max(0, this.alpha);
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fill();
        };

        function createFirework() {
            const x = Math.random() * canvas.width;
            const y = Math.random() * canvas.height * 0.5;
            const colors = ['#ff0044', '#00ffcc', '#ffcc00', '#ff00ff', '#00ccff'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            
            for(let i=0; i<80; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            particles.forEach((p, index) => {
                p.update(); p.draw();
                if(p.alpha <= 0) particles.splice(index, 1);
            });
        }

        // 循环放烟花
        setInterval(createFirework, 800);
        animate();

        // 3秒后显示文字
        setTimeout(() => {
            document.getElementById('text').style.opacity = 1;
        }, 3000);
    </script>
</body>
</html>
